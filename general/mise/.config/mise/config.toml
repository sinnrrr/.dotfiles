[tools]
# Languages & runtimes
node = "22"
python = "3.14"
dotnet = "10"

"npm:@astrojs/language-server" = "latest"
"npm:firecrawl-cli" = "latest"
"cargo:https://github.com/euclio/mdpls" = "HEAD"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = true }

[hooks]
postinstall = 'corepack enable pnpm'

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "python", "go"]

[settings.python]
uv_venv_auto = "create|source"
