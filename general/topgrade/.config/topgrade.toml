[misc]
disable = [
    "system",
    "claude_code",
    "node",
    "pnpm",
    "pip3",
    "containers",
    "helix",
    "helm",
    "ollama",
    "git_repos",
    "github_cli_extensions",
]

[pre_commands]
"Dotfiles" = "git-pull-quiet ~/.dotfiles; ~/.dotfiles/my.sh >/dev/null"

[commands]
"Work repos" = "git-pull-quiet ~/Work/*/"
