[language-server.mdpls]
command = "mdpls"
config = { markdown.preview.auto = true }

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]
config.vtsls.autoUseWorkspaceTsdk = true

[language-server.taplo.config]
root_dir = [".git", "*.toml"]

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }

[[language]]
name = "typescript"
auto-format = true
language-servers = ["vtsls"]

[[language]]
name = "tsx"
language-servers = ["vtsls"]

[[language]]
name = "javascript"
language-servers = ["vtsls"]

[[language]]
name = "jsx"
language-servers = ["vtsls"]

[[language]]
name = "git-config"
file-types = [{ glob = "*gitconfig*" }, { glob = ".config/git/*config*" }, { glob = ".git/config" }, { glob = ".gitmodules" }]

[[language]]
name = "json"
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }

[[language]]
name = "markdown"
auto-format = true
soft-wrap.enable = true
language-servers = ["mdpls"]
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }

[[language]]
name = "toml"
auto-format = true

[[language]]
name = "python"
auto-format = true
