[misc]
disable = [
    "system",
    "claude_code",
    "node",
    "pnpm",
    "pip3",
    "containers",
    "helix",
    "helm",
    "ollama",
    "github_cli_extensions",
]

[git]
repos = [
    "~/.dotfiles",
    "~/Work/*/",
]
pull_predefined = false
fallback_to_fetch_default = true

[post_commands]
"Dotfiles" = "~/.dotfiles/my.sh"
