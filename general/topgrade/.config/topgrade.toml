[misc]
disable = [
    "system",
    "claude_code",
    "node",
    "pnpm",
    "pip3",
    "containers",
    "helix",
    "helm",
    "ollama",
    "github_cli_extensions",
    "github_cli_skills",
    "bun",
    "bun_packages",
    "uv",
]

[git]
repos = [
    "~/Work/*/",
]
pull_predefined = false
fallback_to_fetch_default = true

[pre_commands]
"Dotfiles pull" = "git -C ~/.dotfiles pull --rebase --autostash"
"Work dotfiles pull" = "test ! -d ~/.dotfiles/work || git -C ~/.dotfiles/work pull --rebase --autostash"
"Dotfiles submodules" = "git -C ~/.dotfiles submodule update --remote --merge"
"Dotfiles apply" = "~/.dotfiles/my.sh"

[commands]
"Vale styles" = "vale --config ~/.agents/vale/.vale.ini sync"
