# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
promptToReturnFromSubprocess: false
git:
  diffRenderers:
    - command: delta --paging=never
    - command: difft --color=always
      type: extDiff
gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
customCommands:
  - key: W
    description: worktrunk
    commandMenu:
      - key: n
        context: global
        description: New worktree from fresh default branch
        prompts:
          - type: input
            title: Branch name
            key: Name
        command: wt new {{.Form.Name | quote}} --no-cd --yes
        output: logWithPty
        loadingText: Creating worktree
      - key: d
        context: worktrees
        description: Remove selected worktree
        command: wt remove --foreground {{.SelectedWorktree.Path | quote}}
        output: terminal
      - key: p
        context: global
        description: Prune merged worktrees
        command: wt step prune --foreground
        output: terminal
  - key: X
    description: git-spice
    commandMenu:
      - key: c
        context: global
        description: Create stacked branch
        prompts:
          - type: input
            title: Branch name
            key: Name
          - type: input
            title: Commit message
            key: Message
        command: git-spice branch create {{.Form.Name | quote}} -m {{.Form.Message | quote}}
        output: popup
      - key: t
        context: localBranches
        description: Track selected branch
        command: git-spice --no-prompt branch track {{.SelectedLocalBranch.Name | quote}}
        output: popup
      - key: r
        context: global
        description: Restack stack
        command: git-spice --no-prompt stack restack
        output: popup
      - key: s
        context: global
        description: Sync with remote and restack
        command: git-spice --no-prompt repo sync --restack
        output: popup
      - key: S
        context: global
        description: Submit stack
        command: git-spice stack submit --fill --no-prompt --no-web
        output: popup
      - key: l
        context: global
        description: Show stack
        command: git-spice log short
        output: popup
