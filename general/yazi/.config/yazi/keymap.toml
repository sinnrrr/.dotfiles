[[mgr.prepend_keymap]]
on = "R"
run = "plugin macos-trash"
desc = "Open macOS Trash"

[[mgr.prepend_keymap]]
on = "o"
run = "shell -- qlmanage -p %s"
desc = "QuickLook"

[[mgr.prepend_keymap]]
on = ["c", "i"]
run = """
	shell 'compress-image %h'
"""
desc = "Compress image"

[[mgr.prepend_keymap]]
on = ["c", "v"]
run = """
	shell --block 'compress-video %h'
"""
desc = "Compress video"

[[mgr.prepend_keymap]]
on = ["c", "o"]
run = """
	shell --block 'magick %s -compress jpeg -quality 85 output.pdf && echo "PDF created: output.pdf"' --confirm
"""
desc = "Convert selected images to PDF"

[[mgr.prepend_keymap]]
on = ["c", "p"]
run = """
	shell 'pdfunite %s merged.pdf'
"""
desc = "Merge selected PDFs"

[[mgr.prepend_keymap]]
on = ["c", "j"]
run = """
	shell 'f=%h; pdftoppm -jpeg -jpegopt quality=92 -r 300 "$f" "${f%.pdf}"'
"""
desc = "PDF to JPEG"

[[mgr.prepend_keymap]]
on = ["c", "s"]
run = '''
  shell 'f=%h; curl -F"file=@$f" https://0x0.st | pbcopy' --confirm
'''
desc = "Share file"

[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "chmod"

[[mgr.prepend_keymap]]
on = ["c", "l", "s"]
run = "shell --block -- claude --model haiku --effort high"
desc = "Claude: Haiku, high"

[[mgr.prepend_keymap]]
on = ["c", "l", "m"]
run = "shell --block -- claude --model sonnet --effort high"
desc = "Claude: Sonnet, high"

[[mgr.prepend_keymap]]
on = ["c", "l", "l"]
run = """shell --block -- claude --model opus --effort xhigh --settings '{"fastMode":true}'"""
desc = "Claude: Opus, xhigh, fast"

[[mgr.prepend_keymap]]
on = ["c", "l", "x"]
run = """shell --block -- claude --model fable --effort xhigh --settings '{"fastMode":true}'"""
desc = "Claude: Fable, xhigh, fast"

[[mgr.prepend_keymap]]
on = ["c", "r"]
run = "shell --block -- claude --resume"
desc = "Resume claude conversation"

[[mgr.prepend_keymap]]
on = ["c", "h"]
run = "shell --block -- claude-history"
desc = "Browse claude history via claude-history"

[[mgr.prepend_keymap]]
on = ["c", "x"]
run = """
	shell --block 'run'
"""
desc = "Fuzzy-run an npm script or Makefile target"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = '''
	shell 'ya emit cd "$(git rev-parse --show-toplevel)"' 
'''
desc = "Go to git root"

[[mgr.prepend_keymap]]
on = ["g", "g"]
run = "shell --block lazygit-cd"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "follow"
desc = "Go to the symlink original directory"

[[mgr.prepend_keymap]]
on = ["C", "d"]
run = "cd ~/Documents"

[[mgr.prepend_keymap]]
on = ["C", "h"]
run = "cd ~"

[[mgr.prepend_keymap]]
on = ["C", "D"]
run = "cd ~/Downloads"

[[mgr.prepend_keymap]]
on = ["C", "c"]
run = "cd ~/.config"

[[mgr.prepend_keymap]]
on = ["C", "C"]
run = "cd ~/.dotfiles"

[[mgr.prepend_keymap]]
on = ["C", "w"]
run = "cd ~/Work/documents"

[[mgr.prepend_keymap]]
on = ["C", "W"]
run = "cd ~/Work"
